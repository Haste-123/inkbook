<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inkbook">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Inkbook</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ================= LIBRARY ================= -->
<section id="library">
  <aside id="libSide" class="lib-side">
    <div class="side-brand"><h1 id="appName">Inkbook</h1></div>
    <nav class="side-nav">
      <button data-view="home"><span data-icon="home"></span>Home</button>
      <button data-view="fav"><span data-icon="star"></span>Favorites</button>
      <button data-view="recent"><span data-icon="clock"></span>Recent</button>
      <button data-view="planner"><span data-icon="calendar"></span>Planner<span class="nav-count" id="plannerCount"></span></button>
      <div class="side-label">Folders <button class="mini-btn" id="newFolderSide" title="New folder" data-icon="plus"></button></div>
      <div id="folderTree" class="tree"></div>
    </nav>
    <div class="side-bottom">
      <button id="importSide"><span data-icon="download"></span>Import notes</button>
      <button id="convertSide"><span data-icon="convert"></span>Convert files</button>
      <button id="helpSide"><span data-icon="help"></span>Help &amp; tips</button>
      <button id="settingsBtn"><span data-icon="settings"></span>Settings</button>
    </div>
  </aside>
  <div class="drawer-back" id="drawerBack"></div>
  <div class="lib-main" id="libMain">
    <header class="lib-head">
      <button class="icon-btn" id="libMenuBtn" title="Folders" data-icon="sidebar"></button>
      <div id="crumbs" class="crumbs"></div>
      <div class="lib-actions">
        <input id="search" type="search" placeholder="Search notebooks, lessons, text" autocomplete="off">
        <button class="icon-btn" id="sortBtn" title="Sort" data-icon="sort"></button>
        <button class="icon-btn" id="layoutBtn" title="Grid / list" data-icon="list"></button>
        <button class="btn primary" id="newBtn"><span data-icon="plus"></span>New</button>
      </div>
    </header>
    <main id="libContent"></main>
  </div>
</section>

<!-- ================= EDITOR ================= -->
<section id="editor" hidden>
  <header class="toolbar">
    <div class="tb-group tb-left">
      <button class="icon-btn" id="backBtn" title="Library" data-icon="back"></button>
      <button class="icon-btn" id="sideBtn" title="Outline, saved items, pages & bookmarks" data-icon="sidebar"></button>
      <div id="nbTitle" class="nb-title" title="Double-tap to rename"></div>
    </div>
    <div class="tb-group tb-mid">
      <div class="tb-pill">
        <button class="icon-btn" id="undoBtn" title="Undo (two-finger tap)" data-icon="undo"></button>
        <button class="icon-btn" id="redoBtn" title="Redo (three-finger tap)" data-icon="redo"></button>
      </div>
      <div class="tb-pill tools-pill">
        <button class="icon-btn tool" data-tool="pen" data-pop-anchor title="Pen (P) — tap again for options" data-icon="pen"></button>
        <button class="icon-btn tool" data-tool="hl" data-pop-anchor title="Highlighter (H)" data-icon="hl"></button>
        <button class="icon-btn tool" data-tool="eraser" data-pop-anchor title="Eraser (E)" data-icon="eraser"></button>
        <button class="icon-btn tool" data-tool="shape" data-pop-anchor title="Shapes (S)" data-icon="shape"></button>
        <button class="icon-btn tool" data-tool="lasso" data-pop-anchor title="Lasso select (L)" data-icon="lasso"></button>
        <button class="icon-btn tool" data-tool="text" data-pop-anchor title="Text (T)" data-icon="text"></button>
        <button class="icon-btn tool tool-extra" data-tool="laser" data-pop-anchor title="Laser pointer (K) — tap Pen to leave" data-icon="laser"></button>
        <button class="icon-btn" id="imageBtn" title="Insert image (I)" data-icon="image"></button>
      </div>
      <div class="tb-pill opts-pill">
        <div id="optsInline" class="opts-inline"></div>
        <button class="opts-btn" id="optsBtn" data-pop-anchor title="Tool options"><i></i><span data-icon="chev"></span></button>
      </div>
    </div>
    <div class="tb-group tb-right">
      <button class="rec-btn" id="recBtn" title="Record audio (synced to your notes)"><span data-icon="mic"></span><b id="recTime"></b></button>
      <button class="icon-btn" id="bookmarkBtn" title="Bookmark this page" data-icon="bookmark"></button>
      <button class="icon-btn" id="pencilBtn" title="Pencil-only mode: fingers scroll" data-icon="hand"></button>
      <button class="icon-btn" id="addPageBtn" title="Add page" data-icon="addpage"></button>
      <button class="icon-btn" id="moreBtn" data-pop-anchor title="More" data-icon="more"></button>
    </div>
  </header>
  <div class="ed-body">
    <aside id="edSide" class="ed-side" hidden>
      <div class="side-head">
        <div><small>Contents</small><b id="sideTitle"></b></div>
        <button class="icon-btn" id="sideClose" title="Close" data-icon="x"></button>
      </div>
      <div class="side-tabs">
        <button data-tab="outline"><span data-icon="layers"></span>Outline</button>
        <button data-tab="saved"><span data-icon="star"></span>Saved</button>
        <button data-tab="pages"><span data-icon="gridv"></span>Pages</button>
        <button data-tab="marks"><span data-icon="bookmark"></span>Marks</button>
      </div>
      <div id="sideBody" class="side-body"></div>
      <div class="side-foot" id="sideFoot">
        <button class="btn primary" id="addSecBtn"><span data-icon="plus"></span>New lesson</button>
        <button class="btn" id="addTopicBtn"><span data-icon="plus"></span>Topic</button>
      </div>
    </aside>
    <div class="main-area" id="mainArea">
      <div id="scroller"><div id="pages"></div></div>
      <button id="pageInd" class="page-ind"></button>
      <div class="zoom-ctl">
        <button id="zoomOut" title="Zoom out">−</button>
        <button id="zoomFit" title="Fit width"><span id="zoomLbl">100%</span></button>
        <button id="zoomIn" title="Zoom in">+</button>
      </div>
      <div id="favBar" class="fav-bar"></div>
    </div>
    <aside id="refPane" class="ref-pane" hidden></aside>
  </div>
</section>

<input type="color" id="colorPick" class="hidden-input" tabindex="-1">
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
<script src="features.js"></script>
<script src="extras.js"></script>
<script src="organize.js"></script>
<script src="typeset.js"></script>
<script src="tables.js"></script>
<script src="plus.js"></script>
<script src="io.js"></script>
</body>
</html>
